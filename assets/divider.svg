<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28" role="img" aria-label="divider">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2A6D"/>
      <stop offset="0.5" stop-color="#D300C5"/>
      <stop offset="1" stop-color="#05D9E8"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#05D9E8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <path d="M10 14H400L410 8H490L500 14H890" fill="none" stroke="url(#neon)" stroke-width="2"/>
    <path d="M410 20H490" stroke="#05D9E8" stroke-width="1" opacity="0.7"/>
    <rect x="2" y="10" width="8" height="8" fill="#FF2A6D" transform="rotate(45 6 14)"/>
    <rect x="890" y="10" width="8" height="8" fill="#05D9E8" transform="rotate(45 894 14)"/>
    <rect x="446" y="10" width="8" height="8" fill="#F9F002" transform="rotate(45 450 14)"/>
    <circle cx="10" cy="14" r="3" fill="#ffffff">
      <animate attributeName="cx" values="10;890;10" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#FF2A6D;#05D9E8;#FF2A6D" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
