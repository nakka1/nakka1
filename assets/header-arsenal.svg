      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <clipPath id="clip"><polygon points="22,4 896,4 896,62 874,82 4,82 4,24"/></clipPath>
